services:
  - type: web
    name: iceman-code-learn
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONES
        value: "+233550381372,+233545274761"
      - key: UPLOAD_DIR
        value: "/var/data/uploads"
      - key: NODE_ENV
        value: "production"
    disk:
      name: iceman-code-learn-data
      mountPath: /var/data
      sizeGB: 1
